name: score

# Auto-grades every fork on push/PR using the deterministic scorer, writes the
# result to the run's job summary, and then ENFORCES the pass/fail gate:
# the run goes RED until your fork meets the pass threshold AND every required
# deliverable is present, and GREEN once it does. That red X is the signal that
# the capstone isn't finished yet — not a bug. A fresh fork is expected to fail.
#
# This is the SCORING/GATE workflow only. The GRC gate you must build for the
# pipeline points is a SEPARATE workflow you add under .github/workflows/ (see
# docs/CAPSTONE.md for what it must contain).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic self-evaluation
        run: python3 scoring/score.py | tee score.txt

      - name: Publish score to job summary
        if: always()
        run: |
          {
            echo '## PayVault self-evaluation'
            echo ''
            echo '```'
            cat score.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload score report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score-report
          path: scoring/score-report.json

      - name: Enforce pre-flight gate (fails until audit-ready)
        run: python3 scoring/score.py --gate --quiet
